<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Course logo, the Core C++ logo between semantic brackets">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="18" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- left semantic bracket ⟦ -->
    <path d="M 20 26 H 12 V 70 H 20" stroke-width="3.2"/>
    <line x1="17" y1="26" x2="17" y2="70" stroke-width="3.2"/>
    <!-- right semantic bracket ⟧ -->
    <path d="M 76 26 H 84 V 70 H 76" stroke-width="3.2"/>
    <line x1="79" y1="26" x2="79" y2="70" stroke-width="3.2"/>
    <!-- core, a C inside a C -->
    <path d="M 49.4 36.6 A 16 16 0 1 0 49.4 59.4" stroke-width="5"/>
    <path d="M 43.3 42.7 A 7.5 7.5 0 1 0 43.3 53.3" stroke-width="4"/>
    <!-- ++ -->
    <line x1="56" y1="48" x2="64" y2="48" stroke-width="3.2"/>
    <line x1="60" y1="44" x2="60" y2="52" stroke-width="3.2"/>
    <line x1="66" y1="48" x2="74" y2="48" stroke-width="3.2"/>
    <line x1="70" y1="44" x2="70" y2="52" stroke-width="3.2"/>
  </g>
</svg>
